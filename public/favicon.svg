<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Card Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-opacity="0.4" />
  
  <!-- Harvester / Combine Silhouette -->
  <!-- Main Cabin & Body -->
  <path d="M140 330 L200 200 L320 200 L370 270 L390 330 Z" fill="url(#accentGrad)" />
  
  <!-- Cabin Glass Window -->
  <path d="M215 215 L305 215 L345 270 L215 270 Z" fill="#0f172a" opacity="0.85" />
  
  <!-- Front Reel Cutter Assembly -->
  <path d="M70 330 L160 330 L140 365 L50 365 Z" fill="url(#goldGrad)" />
  <path d="M60 330 L75 295 M85 330 L100 295 M110 330 L125 295 M135 330 L150 295 M160 330 L175 295" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round" />
  <circle cx="110" cy="330" r="16" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="6" />

  <!-- Rear Wheel -->
  <circle cx="340" cy="345" r="68" fill="#0f172a" stroke="#ffffff" stroke-width="12" />
  <circle cx="340" cy="345" r="42" fill="url(#accentGrad)" />
  <circle cx="340" cy="345" r="18" fill="#ffffff" />
  
  <!-- Front Wheel -->
  <circle cx="185" cy="360" r="48" fill="#0f172a" stroke="#ffffff" stroke-width="10" />
  <circle cx="185" cy="360" r="28" fill="url(#goldGrad)" />
  <circle cx="185" cy="360" r="12" fill="#ffffff" />
  
  <!-- Exhaust Pipe & Smoke Stream -->
  <rect x="305" y="145" width="16" height="55" rx="5" fill="#ffffff" />
  <path d="M313 145 C 313 125, 335 120, 340 105 C 345 90, 330 80, 345 65" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8" />
  
  <!-- Wheat / Grain Sheaf Accent -->
  <path d="M410 210 Q 440 170 455 130 M 410 210 Q 425 155 420 120 M 410 210 Q 450 190 470 170" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" fill="none" />
</svg>
